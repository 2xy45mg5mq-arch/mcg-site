<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOP FLOOR — Art Deco Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Bebas+Neue&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0d10;
      --text: #e4e4e4;
      --gold: #b8a472;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      position: relative;
      padding: 25vh 24px 0;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
      overflow: hidden;
    }
    .hero-bg img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0.8;
      filter: brightness(1.3) drop-shadow(0 0 30px rgba(184, 164, 114, 0.15));
      transform: scale(1.15);
    }
    /* Darken only center for text, keep sides/edges bright */
    .hero-bg::after {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at center 50%, rgba(10, 13, 16, 0.65) 10%, rgba(10, 13, 16, 0.15) 28%, transparent 50%);
    }
    .hero-content { position: relative; z-index: 2; }
    .hero-content h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(6rem, 17vw, 13rem);
      line-height: 0.85;
      margin-bottom: 0;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f0ece4;
      text-shadow:
        0 4px 40px rgba(0, 0, 0, 1),
        0 8px 60px rgba(0, 0, 0, 0.95),
        0 2px 5px rgba(0, 0, 0, 1),
        0 0 80px rgba(184, 164, 114, 0.12);
      position: relative;
    }
    .hero-content h1 span {
      display: block;
      width: 100%;
      text-align: center;
      letter-spacing: -0.08em;
      position: relative;
      z-index: 1;
    }
    .hero-content h1 .word-top {
      font-weight: 400;
      padding-right: 0.08em;
    }
    .hero-content h1 .word-floor {
      font-weight: 900;
    }

    /* ── TOWER / LOGLINE BUILDING ── */
    .tower-wrap {
      margin-top: 20px;
      display: flex; flex-direction: column; align-items: center;
      width: 100%;
      position: relative;
    }
    .tower-floor {
      position: relative; text-align: center;
      padding: var(--pad, 10px 0);
      border-bottom: 1px solid rgba(184, 164, 114, 0.12);
      opacity: 0;
      animation: floorBang 0.2s ease-out forwards;
      animation-delay: var(--d, 0s);
    }
    .tower-floor:first-child { border-top: 1px solid rgba(184, 164, 114, 0.12); }
    .tower-floor::before,
    .tower-floor::after {
      content: ''; position: absolute; top: 0; bottom: 0;
      width: 1px; background: rgba(184, 164, 114, 0.08);
    }
    .tower-floor::before { left: 0; }
    .tower-floor::after { right: 0; }
    .tower-floor .fl-text {
      font-family: 'Bebas Neue', sans-serif;
      text-transform: uppercase; text-align: center;
      letter-spacing: 0.1em;
      font-size: var(--fs, 0.85rem);
      color: var(--c, rgba(228,228,228,0.6));
      text-shadow:
        0 2px 20px rgba(10, 13, 16, 0.95),
        0 4px 30px rgba(10, 13, 16, 0.85),
        0 0 60px rgba(10, 13, 16, 0.6);
    }
    .byline-floor .fl-text { letter-spacing: 0.18em; }
    .byline-floor:first-child .fl-text {
      font-variant: small-caps;
      text-transform: none;
    }

    /* ── PYRAMID LINES ── */
    .pyramid-line-1 { max-width: 680px; margin: 0 auto; }
    .pyramid-line-1 .fl-text { font-size: 1.61rem; }

    .pyramid-line-2 { max-width: 920px; margin: 0 auto; }
    .pyramid-line-2 .fl-text { font-size: 2.13rem; }

    .pyramid-line-3 { max-width: 1140px; margin: 0 auto; }
    .pyramid-line-3 .fl-text { font-size: 2.36rem; }

    .tower-sep {
      width: var(--w, 50%); margin: 0 auto;
      border: none; border-top: 1px solid rgba(184, 164, 114, 0.25);
      padding: 0; height: 0;
      opacity: 0;
      animation: floorBang 0.15s ease-out forwards;
      animation-delay: var(--d, 0s);
    }
    .genre-below {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.95rem; letter-spacing: 0.4em;
      font-weight: 400;
      color: rgba(228, 228, 228, 0.5); text-transform: uppercase;
      background: linear-gradient(to bottom, rgba(10, 13, 16, 0.6) 0%, var(--bg) 40%);
      text-align: center;
      padding: 15px 24px 60px;
      max-width: 100%;
      opacity: 0;
      animation: floorBang 0.3s ease-out forwards;
      animation-delay: 1.3s;
      font-style: italic;
      position: relative;
      text-shadow:
        0 2px 20px rgba(10, 13, 16, 0.95),
        0 4px 30px rgba(10, 13, 16, 0.85);
    }
    .genre-below::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 60%; max-width: 600px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(184, 164, 114, 0.25) 30%, rgba(184, 164, 114, 0.25) 70%, transparent);
    }
    @keyframes floorBang {
      0% { opacity: 0; transform: translateY(-8px); }
      65% { opacity: 1; transform: translateY(1px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .hero-content h1 { font-size: clamp(3.5rem, 16vw, 7rem); }
      .tower-wrap { margin-top: 32px; padding: 0 12px; }
      .pyramid-line-1 { max-width: 360px; }
      .pyramid-line-1 .fl-text { font-size: 1rem; }
      .pyramid-line-2 { max-width: 500px; }
      .pyramid-line-2 .fl-text { font-size: 1.2rem; }
      .pyramid-line-3 { max-width: 640px; }
      .pyramid-line-3 .fl-text { font-size: 1.35rem; }
      .genre-below { font-size: 1.4rem; letter-spacing: 0.28em; }
    }
    @media (max-width: 480px) {
      .hero { padding-bottom: 40px !important; }
      .hero-content h1 { font-size: 18vw !important; }
      .tower-wrap { margin-top: 15px !important; }
      .tower-floor { border-color: transparent !important; }
      .tower-floor:first-child { border-top-color: transparent !important; }
      .tower-floor::before, .tower-floor::after { display: none; }
      .tower-sep { opacity: 0 !important; height: 6px; }
      .byline-floor:first-child .fl-text { font-size: 3vw !important; }
      .byline-floor:nth-child(2) .fl-text { font-size: 3.5vw !important; }
      .pyramid-line-1 .fl-text { font-size: 3.5vw !important; white-space: nowrap !important; }
      .pyramid-line-2 .fl-text { font-size: 3.8vw !important; white-space: nowrap !important; }
      .pyramid-line-3 .fl-text { font-size: 4vw !important; white-space: nowrap !important; }
      .genre-below { font-size: 3.5vw !important; padding: 15px 20px 40px !important; letter-spacing: 0.12em !important; white-space: nowrap !important; }
    }
    @media (max-width: 375px) {
      .hero-content h1 { font-size: 17vw !important; }
      .pyramid-line-1 .fl-text { font-size: 3.2vw !important; white-space: nowrap !important; }
      .pyramid-line-2 .fl-text { font-size: 3.5vw !important; white-space: nowrap !important; }
      .pyramid-line-3 .fl-text { font-size: 3.8vw !important; white-space: nowrap !important; }
      .genre-below { font-size: 3.2vw !important; letter-spacing: 0.1em !important; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="hero-bg">
      <img src="/images/tf_art_deco_pyramid.webp?v=1" alt="Art Deco Pyramid Tower">
    </div>
    <div class="hero-content">
      <h1><span class="word-top">TOP</span><span class="word-floor">FLOOR</span></h1>
      <div class="tower-wrap">
        <div class="tower-floor byline-floor" style="max-width:200px; margin:0 auto; --pad:8px 12px; --fs:0.75rem; --c:rgba(228,228,228,0.5); --d:0.3s">
          <div class="fl-text">written by</div>
        </div>
        <div class="tower-floor byline-floor" style="max-width:280px; margin:0 auto; --pad:10px 12px; --fs:1rem; --c:rgba(228,228,228,0.7); --d:0.5s">
          <div class="fl-text">max coyne-green</div>
        </div>
        <hr class="tower-sep" style="--w:36%; --d:0.5s">
        <div class="tower-floor pyramid-line-1" style="--c:rgba(228,228,228,0.7); --d:0.7s">
          <div class="fl-text">an ambitious manhattan doorman</div>
        </div>
        <div class="tower-floor pyramid-line-2" style="--c:rgba(228,228,228,0.8); --d:0.9s">
          <div class="fl-text">moves into his doppelgänger's penthouse</div>
        </div>
        <div class="tower-floor pyramid-line-3" style="--c:rgba(228,228,228,0.9); --d:1.1s">
          <div class="fl-text">only to be trapped in a dangerous new identity</div>
        </div>
      </div>
    </div>
  </header>

  <div class="genre-below">Feature &middot; Psychological Thriller</div>

</body>
</html>
